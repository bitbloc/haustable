name: Supabase Weekly Database Backup

on:
  schedule:
    # Run every Sunday at 03:00 AM UTC (10:00 AM Thailand Time GMT+7)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Generate Timestamp
        id: timestamp
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          mkdir -p ./backups

      - name: Dump Database Schema & Roles
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Dumping Schema and Roles for Project $PROJECT_REF..."
          # Dump Schema (Public + Extensions)
          supabase db dump --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" -f "./backups/schema_${{ env.TIMESTAMP }}.sql"
          
          # Dump Roles & Permissions
          supabase db dump --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --role-only -f "./backups/roles_${{ env.TIMESTAMP }}.sql"

      - name: Dump Database Data (All Records)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Dumping Data..."
          # Dump Public Schema Data (POS, Bookings, Orders, Tables, etc.)
          supabase db dump --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --data-only -f "./backups/data_public_${{ env.TIMESTAMP }}.sql"
          
          # Optional: Dump Auth schema users data if needed
          supabase db dump --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --data-only --schema auth -f "./backups/data_auth_${{ env.TIMESTAMP }}.sql" || true

      - name: Compress Backups
        run: |
          cd ./backups
          tar -czvf "supabase_backup_${{ env.TIMESTAMP }}.tar.gz" *.sql
          rm -f *.sql
          ls -lh

      - name: Upload Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.TIMESTAMP }}
          path: ./backups/supabase_backup_${{ env.TIMESTAMP }}.tar.gz
          retention-days: 60 # เก็บไฟล์ไว้ย้อนหลัง 60 วัน (ประมาณ 8 สัปดาห์)
